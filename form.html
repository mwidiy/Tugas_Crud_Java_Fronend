<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah/Edit Data Kendaraan</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5" style="max-width: 800px;">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0" id="formTitle">Tambah Data Kendaraan</h5>
        </div>
        <div class="card-body p-4">
            <form id="kendaraanForm">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">No. Registrasi Kendaraan</label>
                        <input type="text" class="form-control" id="noRegistrasi" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tahun Pembuatan</label>
                        <input type="number" class="form-control" id="tahunPembuatan" maxlength="4" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Nama Pemilik</label>
                        <input type="text" class="form-control" id="namaPemilik" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Kapasitas Silinder</label>
                        <input type="number" class="form-control" id="kapasitasSilinder" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Merk Kendaraan</label>
                        <input type="text" class="form-control" id="merkKendaraan" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Warna Kendaraan</label>
                        <select class="form-select" id="warnaKendaraan" required>
                            <option value="">Pilih Warna</option>
                            <option value="Merah">Merah</option>
                            <option value="Hitam">Hitam</option>
                            <option value="Biru">Biru</option>
                            <option value="Abu-Abu">Abu-Abu</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Alamat Pemilik Kendaraan</label>
                        <textarea class="form-control" id="alamat" rows="3" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Bahan Bakar</label>
                        <input type="text" class="form-control" id="bahanBakar" required>
                    </div>
                </div>

                <div class="d-flex border-top pt-3">
                    <button type="submit" class="btn btn-primary px-4 me-2" id="btnSave">Simpan</button>
                    <a href="index.html" class="btn btn-secondary px-4">Kembali</a>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/app.js"></script>
</body>
</html>
