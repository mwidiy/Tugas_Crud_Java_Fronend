<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Data Kendaraan</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Aplikasi Data Kendaraan</h5>
        </div>
        <div class="card-body">
            <!-- Search Form -->
            <div class="row mb-3 bg-warning-subtle p-3 rounded mx-0">
                <div class="col-md-3">
                    <label class="form-label">No Registrasi</label>
                    <input type="text" id="searchNoRegistrasi" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Nama Pemilik</label>
                    <input type="text" id="searchNamaPemilik" class="form-control form-control-sm">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="d-flex justify-content-end mb-3">
                <button class="btn btn-primary btn-sm me-2 px-4" id="btnSearch">Search</button>
                <a href="form.html?mode=add" class="btn btn-primary btn-sm px-4">Add</a>
            </div>

            <!-- Data Table -->
            <div class="table-responsive">
                <table class="table table-bordered table-striped table-hover text-center align-middle" style="font-size: 0.85rem;">
                    <thead class="table-primary">
                        <tr>
                            <th>No</th>
                            <th>No Registrasi</th>
                            <th>Nama Pemilik</th>
                            <th>Merk Kendaraan</th>
                            <th>Tahun Pembuatan</th>
                            <th>Kapasitas</th>
                            <th>Warna</th>
                            <th>Bahan Bakar</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Data will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-body text-center mt-3">
                <p>Anda yakin menghapus data <span id="deleteTargetId" class="fw-bold"></span> ?</p>
                <input type="hidden" id="deleteNoRegistrasi">
            </div>
            <div class="modal-footer justify-content-center border-0 mb-2">
                <button type="button" class="btn btn-primary btn-sm px-4" id="btnConfirmDelete">OK</button>
                <button type="button" class="btn btn-secondary btn-sm px-4" data-bs-dismiss="modal">Batal</button>
            </div>
        </div>
    </div>
</div>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Custom JS -->
<script src="js/app.js"></script>
</body>
</html>
